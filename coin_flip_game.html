    <section id="coin-toss">
        <h2>Coin Toss</h2>
        <img id="coin" src="/resources/flip-a-rs-10-indian-coin-head.png" alt="Coin">

        <p id="result">Click the coin to toss</p>
        <p id="counter">Total Tosses: 0</p>
    </section>
    <script>
        const coin = document.getElementById("coin");
        
        const result = document.getElementById("result");

        let flipping = false;

        coin.addEventListener("click", tossCoin);

        let tossCount = 0;

        function tossCoin() {

            if (flipping) return;

            flipping = true;

            tossCount++;
            document.getElementById("counter").textContent =`Total Tosses: ${tossCount}`;

            coin.classList.add("flip");
            result.textContent = "Flipping...";
            const toss = Math.random() < 0.5 ? "Heads" : "Tails";

                setTimeout(() => {
                    if(toss == "Heads"){
                    coin.src = "/resources/flip-a-rs-10-indian-coin-head.png";
                }
                else{
                    coin.src = "/resources/flip-a-rs-10-indian-coin-tail.png";
                }
            result.textContent = toss;
            coin.classList.remove("flip");
            flipping = false;
            }, 1000);
        }
    </script>
